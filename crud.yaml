      - name: User-Agent
        value: insomnia/12.1.0
        description: ""
        disabled: false
    scripts:
      afterResponse: >+
        insomnia.test('Check if status is 200', () => {
            insomnia.expect(insomnia.response.code).to.eql(200);
        });



        insomnia.test('Check keys', () => {

        		insomnia.expect(insomnia.response.json()).to.be.an('object').that.has.all.keys
        		(
        				'ID', 'Title', 'Description', 'Completed'
        		);
        });



    settings:
